# ----------------------------------------------------- 
# Autostart
# ----------------------------------------------------- 

# Start Polkit
exec-once = systemctl --user start hyprpolkitagent

# Notifications
exec-once = mako

# Wallpaper
exec-once = hyprpaper
exec-once = ~/.config/hypr/scripts/wallpaper.sh

# Idle
# Now starting as a service
# exec-once = hypridle

# Remap
exec-once = xremap ~/.config/xremap/config.yml
